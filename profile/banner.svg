<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Team Pharos</title>
  <desc id="d">Маяк над ночным морем и надпись Team Pharos</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.6" stop-color="#14224a"/>
      <stop offset="1" stop-color="#2a4585"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10224a"/>
      <stop offset="1" stop-color="#050a1c"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#ffd24a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <clipPath id="tower">
      <polygon points="976,254 1044,254 1030,140 990,140"/>
    </clipPath>
  </defs>

  <style>
    .bl{animation:sweepL 8s ease-in-out infinite}
    .br{animation:sweepR 8s ease-in-out infinite}
    @keyframes sweepL{0%,100%{opacity:1}50%{opacity:.08}}
    @keyframes sweepR{0%,100%{opacity:.08}50%{opacity:1}}
    .st{animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    .wv{animation:wv 14s linear infinite}
    @keyframes wv{to{transform:translateX(-320px)}}
    .pulse{animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(1.1);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- небо -->
  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- звёзды -->
  <g fill="#fff">
    <circle class="st" cx="60"   cy="40"  r="1.4" style="animation-delay:0s"/>
    <circle class="st" cx="140"  cy="76"  r="1"   style="animation-delay:1.2s"/>
    <circle class="st" cx="230"  cy="32"  r="1.6" style="animation-delay:2.1s"/>
    <circle class="st" cx="312"  cy="68"  r="1"   style="animation-delay:.6s"/>
    <circle class="st" cx="420"  cy="28"  r="1.3" style="animation-delay:3s"/>
    <circle class="st" cx="520"  cy="62"  r="1"   style="animation-delay:1.7s"/>
    <circle class="st" cx="610"  cy="34"  r="1.5" style="animation-delay:2.6s"/>
    <circle class="st" cx="704"  cy="70"  r="1"   style="animation-delay:.3s"/>
    <circle class="st" cx="790"  cy="30"  r="1.2" style="animation-delay:3.4s"/>
    <circle class="st" cx="870"  cy="62"  r="1.6" style="animation-delay:1s"/>
    <circle class="st" cx="940"  cy="24"  r="1"   style="animation-delay:2.3s"/>
    <circle class="st" cx="1090" cy="44"  r="1.4" style="animation-delay:.9s"/>
    <circle class="st" cx="1160" cy="92"  r="1"   style="animation-delay:2.8s"/>
    <circle class="st" cx="1220" cy="36"  r="1.6" style="animation-delay:1.5s"/>
    <circle class="st" cx="1252" cy="150" r="1"   style="animation-delay:3.2s"/>
    <circle class="st" cx="1130" cy="168" r="1"   style="animation-delay:.4s"/>
    <circle class="st" cx="36"   cy="132" r="1"   style="animation-delay:2s"/>
  </g>

  <!-- лучи маяка -->
  <polygon class="bl" points="1010,118 -20,28 -20,208" fill="url(#beamL)"/>
  <polygon class="br" points="1010,118 1300,94 1300,142" fill="url(#beamR)"/>
  <circle class="pulse" cx="1010" cy="118" r="64" fill="url(#glow)"/>

  <!-- море -->
  <g class="wv">
    <path d="M0 268 Q 80 258 160 268 T 320 268 T 480 268 T 640 268 T 800 268 T 960 268 T 1120 268 T 1280 268 T 1440 268 T 1600 268 V320 H0 Z" fill="url(#sea)"/>
    <path d="M0 286 Q 80 279 160 286 T 320 286 T 480 286 T 640 286 T 800 286 T 960 286 T 1120 286 T 1280 286 T 1440 286 T 1600 286" fill="none" stroke="#7f9be0" stroke-opacity="0.22" stroke-width="1.5"/>
    <path d="M0 302 Q 80 296 160 302 T 320 302 T 480 302 T 640 302 T 800 302 T 960 302 T 1120 302 T 1280 302 T 1440 302 T 1600 302" fill="none" stroke="#7f9be0" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>
  <ellipse cx="1010" cy="280" rx="70" ry="7" fill="url(#glow)" opacity="0.7"/>

  <!-- скалы и маяк -->
  <polygon points="936,320 958,266 984,252 1036,252 1064,266 1088,320" fill="#070b18"/>
  <g clip-path="url(#tower)">
    <rect x="970" y="140" width="80" height="116" fill="#eef2fb"/>
    <rect x="970" y="152" width="80" height="26" fill="#c8323c"/>
    <rect x="970" y="204" width="80" height="26" fill="#c8323c"/>
    <rect x="970" y="140" width="80" height="116" fill="url(#shade)"/>
  </g>
  <rect x="980" y="132" width="60" height="9" rx="2" fill="#1a2342"/>
  <rect x="984" y="122" width="52" height="3" fill="#1a2342"/>
  <rect x="997" y="104" width="26" height="28" rx="2" fill="url(#lamp)" stroke="#1a2342" stroke-width="2"/>
  <line x1="1010" y1="104" x2="1010" y2="132" stroke="#1a2342" stroke-width="2"/>
  <polygon points="991,104 1029,104 1010,84" fill="#c8323c"/>
  <circle cx="1010" cy="81" r="3" fill="#1a2342"/>

  <!-- текст -->
  <text x="80" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="6" fill="url(#title)">TEAM PHAROS</text>
  <rect x="84" y="172" width="96" height="4" rx="2" fill="#ffd978"/>
  <text x="82" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#c3cfee">Открытые инструменты для self-hosted инфраструктуры</text>
  <text x="82" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="3" fill="#8497c6">AGENTLESS  ·  SELF-HOSTED  ·  OPEN SOURCE</text>
</svg>
